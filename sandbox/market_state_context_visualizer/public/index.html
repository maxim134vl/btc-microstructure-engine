<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTC-ML Lifecycle Context</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./lifecycle.css" />
  </head>
  <body class="lifecycle-surface">
    <div class="lifecycle-shell" id="viewerRoot">
      <div id="viewerErrorPanel" class="lifecycle-error-panel hidden" role="alert" aria-live="assertive"></div>
      <header class="lifecycle-status" aria-label="Current lifecycle context">
        <div class="lifecycle-status-main" id="statusLine">Loading lifecycle context…</div>
        <div class="lifecycle-status-meta">
          <span id="refreshLine" class="lifecycle-refresh-line">AUTO-REFRESH</span>
          <span id="sourceLine">source: lifecycle episodes</span>
          <label class="lifecycle-range">
            Range
            <select id="rangeSelect">
              <option value="latest500" selected>Last 500 bars</option>
              <option value="latest100">Latest 100</option>
              <option value="latest1000">Latest 1000</option>
              <option value="last7d">Last 7 days</option>
              <option value="last14d">Last 14 days</option>
              <option value="all">All</option>
            </select>
          </label>
          <a class="lifecycle-debug-link" href="./debug.html">Debug</a>
        </div>
      </header>

      <main class="lifecycle-main">
        <div class="lifecycle-chart-wrap">
          <canvas id="lifecycleCanvas"></canvas>
          <div id="hoverReadout" class="lifecycle-hover-readout hidden" aria-live="polite"></div>
          <div class="lifecycle-legend" aria-label="Context legend">
            <span><i class="swatch long"></i>Green = active long context</span>
            <span><i class="swatch short"></i>Red = active short context</span>
            <span><i class="swatch faded"></i>Faded = challenged context</span>
            <span><i class="swatch observe"></i>No fill = observe</span>
          </div>
        </div>
      </main>
    </div>
    <script src="./lifecycle_app.js?v=stage14"></script>
  </body>
</html>
