# Serve the built SPA and reverse-proxy API/WS/health to the dashboard backend.
# `dashboard-api` is the compose service name on the shared network.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA: serve the file if it exists, else fall back to index.html so
    # client-side routes resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /release.json { alias /release/manifest.json; add_header Cache-Control "no-store"; }
    location /market-context/data/ { alias /visual-data/; add_header Cache-Control "no-store"; }
    # REST API.
    location /api/ {
        proxy_pass http://ops-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health passthrough (handy for probes hitting the UI origin).
    location /health {
        proxy_pass http://ops-api:8080;
    }

    # WebSocket live feed — needs the HTTP/1.1 upgrade dance.
    location /ws/ {
        proxy_pass http://ops-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 8765;
    server_name _;
    root /usr/share/nginx/html/market-context;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location /data/ { alias /visual-data/; add_header Cache-Control "no-store"; }
    location = /api/v1/market-context/chart { limit_except GET { deny all; } proxy_pass http://ops-api:8080; }
    location /api/ { return 404; }
    location = /release.json { alias /release/manifest.json; add_header Cache-Control "no-store"; }
}
