    command:
    - python
    - -u
    - /opt/btcml-legacy-original/io_runtime.py
    - /opt/btcml-legacy-original/engines/inventory_engine.py
    - inventory_states.parquet
    restart: unless-stopped
    labels:
      org.btcml.purpose: original-binance-futures-analytical-sources
      org.btcml.release: 2026.09.22
    healthcheck: {disable: true}
    depends_on:
      legacy-multi-exchange:
        condition: service_started
    network_mode: none
    mem_limit: 512m
    cpus: '0.5'
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    build:
      context: ./legacy_sources/sources
      dockerfile: proposal/Dockerfile.sources.candidate
  legacy-acceptance:
    image: btc-ml-legacy-sources:integrated-binance-20261003-v1
    read_only: true
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    user: 10001:10001
    working_dir: /legacy
