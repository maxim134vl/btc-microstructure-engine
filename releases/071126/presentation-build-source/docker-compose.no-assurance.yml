    cap_drop:
    - ALL
    user: 10001:10001
    working_dir: /legacy
    environment:
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '1'
    volumes:
