    entrypoint:
    - /usr/bin/tini
    - --
    command:
    - python
    - -u
    - /opt/btcml-legacy-original/io_runtime.py
    - /opt/btcml-legacy-original/engines/volume_memory_engine.py
    - volume_memory.parquet
    restart: unless-stopped
    labels:
      org.btcml.purpose: original-binance-futures-analytical-sources
      org.btcml.release: 2026.09.22
    healthcheck: {disable: true}
    depends_on:
      legacy-multi-exchange:
        condition: service_started
      legacy-volume-clusters:
        condition: service_started
    network_mode: none
    mem_limit: 512m
    cpus: '0.5'
    pids_limit: 64
    logging:
