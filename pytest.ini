[pytest]
# Canonical collection roots for the active suite.
# archive_removed/ and nested vendor trees are intentionally excluded — they
# contain import-time heavyweight scripts (e.g. historical_liquidation_test.py)
# that hang collection and are not part of the validated runtime.
testpaths =
    tests

norecursedirs =
    archive_removed
    .git
    venv
    .venv
    node_modules
    __pycache__
    .pytest_cache
    .mypy_cache
    .ruff_cache
    data
    logs
    run
    artifacts
    reports
    replays
    catboost_info
    benchmark
    btc-auction-runtime
    apps/context_visualizer/node_modules
    dashboard/frontend/node_modules
    dashboard/frontend/dist

python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -p no:cacheprovider
