# =============================================================================
# docker-compose.prod.yml — STANDALONE production stack.
#
# All images are pulled from the private Fonte registry. No `build:` here.
# Run on the server:
#   docker login http://registry.fonte.kaz
#   cp .env.prod.example .env
#   nano .env                    # set BTC_VERSION + HEALTH_API_PORT
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env pull
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
#
# Env vars (only TWO — everything else is hardcoded sensible defaults):
#   BTC_VERSION      image tag (e.g. 1.0.0)
#   HEALTH_API_PORT  host port for the UI (e.g. 8080)
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-engine-base: &engine-base
  image: registry.fonte.kaz/btc-engine:${BTC_VERSION}
  pull_policy: always
  restart: unless-stopped
  logging: *default-logging
  volumes:
    # Bind mount next to the compose file (./data, ./logs). Make sure these
    # dirs exist on the host and are owned by UID 1000 (btc user in image).
    - ./data:/data
    - ./logs:/logs

x-obs-base: &obs-base
  pull_policy: always
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true

services:

  # =========================================================================
  # ENGINE (data plane)
  # =========================================================================
  binance-feed:
    <<: *engine-base
    container_name: btc_binance_feed
    command: ["python3", "/app/live_binance_feed_v2.py"]
    healthcheck:
      test: ["CMD", "test", "-f", "/data/live_market_feed.parquet"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

  multi-exchange:
    <<: *engine-base
    container_name: btc_multi_exchange
    command: ["python3", "/app/collectors/multi_exchange_collector.py"]
    depends_on: [binance-feed]

  intraday-flow:
    <<: *engine-base
    container_name: btc_intraday_flow
    command: ["python3", "/app/intraday_rest_collector.py"]

  orderbook:
    <<: *engine-base
    container_name: btc_orderbook
    command: ["python3", "/app/collectors/orderbook_collector.py"]

  liquidations:
    <<: *engine-base
    container_name: btc_liquidations
    command: ["python3", "/app/collectors/liquidation_collector.py"]

  oi:
    <<: *engine-base
    container_name: btc_oi
    command: ["python3", "/app/collectors/oi_collector.py"]

  pipeline:
    <<: *engine-base
    container_name: btc_pipeline
    command: ["python3", "/app/autonomous_runtime_v2.py"]
    depends_on:
      - binance-feed
      - multi-exchange
      - orderbook
      - liquidations
      - oi

  # =========================================================================
  # OBSERVABILITY (control plane)
  # =========================================================================
  metrics-exporter:
    <<: *obs-base
    image: registry.fonte.kaz/btc-metrics-exporter:${BTC_VERSION}
    container_name: btc_obs_metrics_exporter
    hostname: metrics-exporter
    user: "10001:10001"
    environment:
      LOG_LEVEL: "INFO"
      DATA_DIR: "/data"
      METRICS_EXPORTER_PORT: "9101"
      METRICS_EXPORTER_SCAN_INTERVAL_SECONDS: "10"
      METRICS_EXPORTER_FEATURE_SAMPLE_ROWS: "2000"
    volumes:
      - ./data:/data:ro
    networks: [obsplane]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9101/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  alert-engine:
    <<: *obs-base
    image: registry.fonte.kaz/btc-alert-engine:${BTC_VERSION}
    container_name: btc_obs_alert_engine
    hostname: alert-engine
    user: "10001:10001"
    environment:
      LOG_LEVEL: "INFO"
      ALERT_ENGINE_PORT: "9102"
      ALERT_ENGINE_REDIS_URL: "redis://redis:6379/0"
      ALERT_ENGINE_METRICS_URL: "http://metrics-exporter:9101"
      ALERT_ENGINE_EVAL_INTERVAL_SECONDS: "15"
      ALERT_ENGINE_COOLDOWN_DEFAULT_SECONDS: "300"
    networks: [obsplane]
    depends_on:
      redis: { condition: service_healthy }
      metrics-exporter: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9102/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  watchdog:
    <<: *obs-base
    image: registry.fonte.kaz/btc-watchdog:${BTC_VERSION}
    container_name: btc_obs_watchdog
    hostname: watchdog
    user: "10001:10001"
    environment:
      LOG_LEVEL: "INFO"
      WATCHDOG_PORT: "9103"
      WATCHDOG_METRICS_URL: "http://metrics-exporter:9101"
      WATCHDOG_STALL_THRESHOLD_SECONDS: "120"
      WATCHDOG_RESTART_BUDGET_PER_HOUR: "10"
      WATCHDOG_DRY_RUN: "false"
      WATCHDOG_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["0"]
    networks: [obsplane]
    depends_on:
      metrics-exporter: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9103/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  health-api:
    <<: *obs-base
    image: registry.fonte.kaz/btc-health-api:${BTC_VERSION}
    container_name: btc_obs_health_api
    hostname: health-api
    user: "10001:10001"
    ports:
      - "${HEALTH_API_PORT:-8080}:8080"
    environment:
      LOG_LEVEL: "INFO"
      HEALTH_API_PORT: "8080"
      HEALTH_API_METRICS_URL: "http://metrics-exporter:9101"
      HEALTH_API_ALERT_ENGINE_URL: "http://alert-engine:9102"
      HEALTH_API_WATCHDOG_URL: "http://watchdog:9103"
      HEALTH_API_CADVISOR_URL: "http://cadvisor:8080"
      HEALTH_API_NODE_EXPORTER_URL: "http://node-exporter:9100"
      HEALTH_API_REDIS_URL: "redis://redis:6379/0"
      HEALTH_API_REFRESH_INTERVAL_SECONDS: "5"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add: ["0"]
    networks: [obsplane]
    depends_on:
      metrics-exporter: { condition: service_healthy }
      alert-engine: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---- vendor images (public registries) ----
  redis:
    image: redis:7.4-alpine
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    user: "999:999"
    command:
      - "redis-server"
      - "--appendonly"
      - "no"
      - "--maxmemory"
      - "64mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - ""
    volumes:
      - btc_obs_redis:/data
    networks: [obsplane]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    devices:
      - /dev/kmsg
    command:
      - "--port=8080"
      - "--housekeeping_interval=10s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,resctrl,cpu_topology,advtcp,oom_event,network"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [obsplane]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    pull_policy: always
    restart: unless-stopped
    logging: *default-logging
    pid: host
    command:
      - "--path.rootfs=/host"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/docker/.+|var/lib/containers/.+)($$|/)"
      - "--collector.netclass.ignored-devices=^(veth.*|docker.*|lo|br-.*)$$"
      - "--web.listen-address=:9100"
      - "--no-collector.wifi"
      - "--no-collector.hwmon"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks: [obsplane]

volumes:
  btc_obs_redis:
    name: btc_obs_redis
  # btc_data / btc_logs are bind-mounted from ../../data and ../../logs.

networks:
  obsplane:
    name: btc_obs_obsplane
    driver: bridge
