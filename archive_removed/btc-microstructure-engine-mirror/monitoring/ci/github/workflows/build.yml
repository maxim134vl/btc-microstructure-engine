name: build

on:
  push:
    branches: [main]
    paths:
      - 'monitoring/**'
  pull_request:
    paths:
      - 'monitoring/**'

jobs:

  python-test:
    name: python-${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [metrics-exporter, alert-engine, health-api, watchdog]
    defaults:
      run:
        working-directory: monitoring/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: ruff check src/

      - name: mypy
        run: mypy --ignore-missing-imports src/

      - name: pytest
        run: pytest -q

  ts-build:
    name: monitor-ui build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitoring/services/monitor-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: monitoring/services/monitor-ui/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    needs: [python-test, ts-build]
    strategy:
      fail-fast: false
      matrix:
        service: [metrics-exporter, alert-engine, health-api, watchdog, monitor-ui]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: monitoring/services/${{ matrix.service }}
          push: false
          load: true
          tags: btc-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max

  compose-validate:
    name: compose validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate every compose file
        working-directory: monitoring
        run: |
          for f in deploy/docker-compose*.yml deploy/swarm/*.yml; do
            echo "::group::$f"
            python3 -c "import yaml; yaml.safe_load(open('$f'))"
            echo "::endgroup::"
          done
