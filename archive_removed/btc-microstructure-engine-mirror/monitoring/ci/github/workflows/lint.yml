name: lint

on:
  push:
    branches: [main]
    paths:
      - 'monitoring/**'
  pull_request:
    paths:
      - 'monitoring/**'

jobs:

  python-lint:
    name: python ruff
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [metrics-exporter, alert-engine, health-api, watchdog]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check monitoring/services/${{ matrix.service }}/src/

  prom-rules:
    name: promtool check rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install promtool
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v2.55.1/prometheus-2.55.1.linux-amd64.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/prometheus-*/promtool /usr/local/bin/promtool
      - name: check rules
        run: promtool check rules monitoring/infra/prometheus/rules/*.yml

  amtool:
    name: amtool check alertmanager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install amtool
        run: |
          curl -fsSL https://github.com/prometheus/alertmanager/releases/download/v0.27.0/alertmanager-0.27.0.linux-amd64.tar.gz \
            | tar xz -C /tmp
          sudo mv /tmp/alertmanager-*/amtool /usr/local/bin/amtool
      - name: check config
        run: amtool check-config monitoring/infra/alertmanager/alertmanager.yml

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: '-x'
        with:
          scandir: monitoring/scripts

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint
      - run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable}}" \
            monitoring/infra monitoring/deploy
