[project]
name = "btc-alert-engine"
version = "0.1.0"
description = "Alertmanager webhook receiver with dedup, cooldown, Redis state, and pubsub fanout"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "aiohttp>=3.9,<4",
  "httpx>=0.27,<1",
  "prometheus_client>=0.20,<1",
  "redis[hiredis]>=5.0,<6",
  "structlog>=24.1,<25",
  "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "fakeredis>=2.23,<3",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
btc-alert-engine = "btc_alert_engine.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RET", "SIM", "TID", "PL"]
ignore = ["E501", "PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
