[project]
name = "btc-metrics-exporter"
version = "0.1.0"
description = "Domain-aware Prometheus exporter for the BTC microstructure data plane"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "aiohttp>=3.9,<4",
  "prometheus_client>=0.20,<1",
  "pyarrow>=16,<19",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "uvloop>=0.19; sys_platform != 'win32'",
  "structlog>=24.1,<25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
btc-metrics-exporter = "btc_metrics_exporter.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RET", "SIM", "TID", "PL"]
ignore = ["E501", "PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
