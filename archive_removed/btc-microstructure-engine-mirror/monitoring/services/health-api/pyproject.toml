[project]
name = "btc-health-api"
version = "0.2.0"
description = "Bootstrap admin UI + REST API for the BTC observability stack"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "redis[hiredis]>=5.0,<6",
  "prometheus_client>=0.20,<1",
  "structlog>=24.1,<25",
  "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "fakeredis>=2.23,<3",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
btc-health-api = "btc_health_api.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"btc_health_api" = ["templates/**/*.html", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RET", "SIM", "TID", "PL"]
ignore = ["E501", "PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
